function renderGallery(){stopGalleryMedia();const frame=document.querySelector('.gallery-frame'),item=galleryItems[galleryIndex],count=galleryItems.length;document.querySelectorAll('.gallery-arrow').forEach(x=>x.hidden=count<2);if(item?.type==='social')frame.innerHTML=socialSlideHTML(item);else if(item?.file){if(item.type==='video')frame.innerHTML='<video src="'+safe(item.file)+'" controls playsinline aria-label="'+safe(item.description||activeMediumName)+'"></video>';else if(item.type==='audio')frame.innerHTML='<div class="audio-slide"><div class="audio-symbol">♪</div><strong>'+safe(item.description||activeMediumName)+'</strong><audio src="'+safe(item.file)+'" controls preload="metadata" aria-label="'+safe(item.description||activeMediumName)+'"></audio></div>';else frame.innerHTML='<img src="'+safe(item.file)+'" alt="'+safe(item.description||activeMediumName)+'">'}else frame.innerHTML='';document.querySelector('.gallery-counter').textContent=(galleryIndex+1)+' / '+count}
function openGallery(mediumId,providedItems){const gallery=document.querySelector('.gallery-overlay'),medium=mediumById(mediumId||activeMediumId);activeMediumId=medium?.id||activeMediumId;activeMediumName=plainMediumName(medium?.name||activeMediumName);galleryItems=providedItems||contentsFor(activeStateId,activeMediumId);if(!galleryItems.length)return;document.querySelector('.gallery-title').innerHTML='<span class="gallery-state">'+safe(activeStateLabel)+'</span><span class="gallery-medium">'+safe(activeMediumName)+'</span>';galleryIndex=0;renderGallery();gallery.classList.add('open');gallery.setAttribute('aria-hidden','false')}
function closeGallery(){const gallery=document.querySelector('.gallery-overlay'),frame=document.querySelector('.gallery-frame');stopGalleryMedia();gallery.classList.remove('open');gallery.setAttribute('aria-hidden','true');frame.innerHTML=''}
addEventListener('DOMContentLoaded',()=>{const gallery=document.querySelector('.gallery-overlay'),card=document.querySelector('.card');card.onclick=e=>{if(e.target.closest('.close'))return;const mediumName=e.target.closest('.state-medium-name[data-medium-id]');if(card.classList.contains('state-card')&&mediumName){openMediumPopup(mediumName.dataset.mediumId);return}const action=e.target.closest('[data-medium-action]');if(card.classList.contains('medium-card')&&action){if(action.dataset.mediumAction==='coverage'){const copy=card.querySelector('[data-coverage-copy]'),expanded=action.getAttribute('aria-expanded')==='true';action.setAttribute('aria-expanded',expanded?'false':'true');copy.hidden=expanded}else if(action.dataset.mediumAction==='testigos'&&!action.disabled){openGallery(activeMediumId,mediumContents(activeMediumId))}}};document.querySelector('.gallery-close').onclick=closeGallery;document.querySelector('.gallery-arrow.prev').onclick=()=>{galleryIndex=(galleryIndex-1+galleryItems.length)%galleryItems.length;renderGallery()};document.querySelector('.gallery-arrow.next').onclick=()=>{galleryIndex=(galleryIndex+1)%galleryItems.length;renderGallery()};gallery.onclick=e=>{if(e.target===gallery)closeGallery()}});
addEventListener('keydown',e=>{if(e.key==='Escape'){const gallery=document.querySelector('.gallery-overlay');if(gallery&&gallery.classList.contains('open'))closeGallery();else close()}if(e.key==='ArrowLeft'&&document.querySelector('.gallery-overlay')?.classList.contains('open')){galleryIndex=(galleryIndex-1+galleryItems.length)%galleryItems.length;renderGallery()}if(e.key==='ArrowRight'&&document.querySelector('.gallery-overlay')?.classList.contains('open')){galleryIndex=(galleryIndex+1)%galleryItems.length;renderGallery()}});

(function () {
  function estaOculto(el) {
    if (!el || !el.isConnected) return true;
    for (let nodo = el; nodo && nodo.nodeType === 1; nodo = nodo.parentElement) {
      if (nodo.hidden || nodo.getAttribute('aria-hidden') === 'true') return true;
      const estilo = window.getComputedStyle(nodo);
      if (estilo.display === 'none' || estilo.visibility === 'hidden' || estilo.visibility === 'collapse') return true;
    }
    return false;
  }

  function detener(el) {
    if (!el || typeof el.pause !== 'function') return;
    try { el.pause(); } catch (_) {}
    try { el.currentTime = 0; } catch (_) {}
  }

  function detenerOcultos() {
    document.querySelectorAll('audio, video').forEach(function (el) {
      if (estaOculto(el)) detener(el);
    });
  }

  document.addEventListener('close', function (ev) {
    if (ev.target && ev.target.matches && ev.target.matches('dialog')) {
      ev.target.querySelectorAll('audio, video').forEach(detener);
    }
  }, true);

  document.addEventListener('cancel', function (ev) {
    if (ev.target && ev.target.matches && ev.target.matches('dialog')) {
      ev.target.querySelectorAll('audio, video').forEach(detener);
    }
  }, true);

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) document.querySelectorAll('audio, video').forEach(detener);
  });

  const observar = function () {
    if (!document.body) return;
    const observer = new MutationObserver(function () {
      window.requestAnimationFrame(detenerOcultos);
    });
    observer.observe(document.body, {
      subtree: true,
      childList: true,
      attributes: true,
      attributeFilter: ['class', 'style', 'hidden', 'aria-hidden']
    });
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', observar, {once:true});
  else observar();
})();
</script>
