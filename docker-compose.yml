# /opt/mapa-mexico/docker-compose.yml
#
# Depende de la red externa creada para Traefik:
#   docker network create traefik_network
#
# Un dominio, enrutado por path: /admin va al editor y todo lo demas a nginx.
# Un solo certificado y ningun DNS nuevo por cada mapa.
#
# Si el editor se cae, los mapas siguen en linea: eso no es casualidad, es el
# motivo de que publicar genere un archivo estatico en lugar de renderizarse al
# vuelo.

services:

  postgres:
    image: postgres:16-alpine
    container_name: mapa-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      # Solo red interna: sin ruta desde el proxy ni desde el exterior.
      - interna

  editor:
    image: ${EDITOR_IMAGE}
    container_name: mapa-editor
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NUXT_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Un directorio por mapa, con su pagina y su multimedia. En la raiz, dos
      # enlaces simbolicos al mapa predeterminado.
      NUXT_SITE_ROOT: /sitio
      NUXT_TEMPLATE_PATH: /plantilla/mapa-base.html
      NUXT_MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2147483648}
      # Tamano del trozo en que viaja una subida. Lo que esquiva no es un
      # limite de tamano sino de TIEMPO: Traefik v3 deja de leer el cuerpo de
      # una peticion a los 60 s por omision, y ese timeout cubre el cuerpo
      # completo. Con 4 MiB un trozo tarda unos 34 s incluso a 1 Mbps de
      # subida. Si alguien reporta subidas que se congelan, este numero baja.
      NUXT_UPLOAD_CHUNK_BYTES: ${UPLOAD_CHUNK_BYTES:-4194304}
      TZ: ${TZ}
    volumes:
      # El editor escribe aqui: sube archivos y publica paginas. Debe pertenecer
      # al uid 1000, que es con el que corre el contenedor.
      - ./sitio:/sitio
      # La plantilla se lee en cada publicacion, asi que corregirla no obliga a
      # reconstruir la imagen.
      - ./mapa-base.html:/plantilla/mapa-base.html:ro
    labels:
      - traefik.enable=true
      # Obligatorio: el editor esta en dos redes y Traefik necesita saber por
      # cual alcanzarlo.
      - traefik.docker.network=traefik_network
      # Mismo host que los mapas, distinto prefijo. La prioridad se declara en
      # lugar de confiar en que Traefik ordene por longitud de regla: si alguna
      # vez empatan, el editor queda detras del catch-all y deja de ser
      # alcanzable.
      - traefik.http.routers.mapa-editor.rule=Host(`${MAPA_HOST}`) && PathPrefix(`/admin`)
      - traefik.http.routers.mapa-editor.priority=100
      - traefik.http.routers.mapa-editor.entrypoints=websecure
      - traefik.http.routers.mapa-editor.tls=true
      - traefik.http.routers.mapa-editor.tls.certresolver=le
      - traefik.http.services.mapa-editor.loadbalancer.server.port=3000
      - traefik.http.middlewares.mapa-editor-headers.headers.STSSeconds=31536000
      - traefik.http.middlewares.mapa-editor-headers.headers.forceSTSHeader=true
      - traefik.http.middlewares.mapa-editor-headers.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.mapa-editor-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.mapa-editor-headers.headers.frameDeny=true
      # La pantalla de login es alcanzable sin sesion, asi que tambien se pide
      # que no se indexe.
      - traefik.http.middlewares.mapa-editor-headers.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow, noarchive
      - traefik.http.routers.mapa-editor.middlewares=mapa-editor-headers@docker
    networks:
      - traefik_network
      - interna

  # Guiones de mantenimiento. No corre como servicio: se invoca a demanda.
  #
  #   docker compose run --rm tools node scripts/create-user.ts --email … --name …
  #
  # Imagen distinta a la del editor a proposito: el servidor expuesto no deberia
  # traer herramientas que crean cuentas y borran archivos.
  tools:
    image: ${TOOLS_IMAGE}
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NUXT_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NUXT_SITE_ROOT: /sitio
      # Dias que sobrevive un archivo tras quitarlo de su medio. Es tambien hasta
      # donde se puede volver en el historial.
      RETENER_ARCHIVOS_DIAS: ${RETENER_ARCHIVOS_DIAS:-90}
      TZ: ${TZ}
    volumes:
      - ./sitio:/sitio
      # Solo lectura: de aqui sale el documento legacy en la importacion inicial.
      - ./datos:/datos:ro
    networks:
      - interna

  mapa:
    image: nginx:1.27-alpine
    container_name: mapa-publico
    restart: always
    environment:
      TZ: ${TZ}
    volumes:
      # Solo lectura: nginx entrega lo que el editor publico, nunca escribe.
      # Un solo montaje: los enlaces de la raiz viven dentro del arbol.
      - ./sitio:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # 127.0.0.1 y no localhost: con el config montado :ro el script de
      # entrypoint no puede agregar el listen de IPv6, y localhost puede
      # resolver a ::1. Un contenedor unhealthy es invisible para Traefik.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_network
      - traefik.http.routers.mapa.rule=Host(`${MAPA_HOST}`)
      - traefik.http.routers.mapa.priority=1
      - traefik.http.routers.mapa.entrypoints=websecure
      - traefik.http.routers.mapa.tls=true
      - traefik.http.routers.mapa.tls.certresolver=le
      - traefik.http.services.mapa.loadbalancer.server.port=80
      - traefik.http.middlewares.mapa-headers.headers.STSSeconds=31536000
      - traefik.http.middlewares.mapa-headers.headers.forceSTSHeader=true
      - traefik.http.middlewares.mapa-headers.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.mapa-headers.headers.contentTypeNosniff=true
      - traefik.http.routers.mapa.middlewares=mapa-headers@docker
    networks:
      - traefik_network

volumes:
  postgres_data:

networks:
  traefik_network:
    external: true
  interna:
