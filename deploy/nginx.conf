# Sirve el arbol de mapas. Solo lectura: el editor escribe, nginx entrega.
#
#   /              -> sitio/index.html   (enlace al mapa predeterminado)
#   /contenidos/…  -> sitio/contenidos   (idem)
#   /<slug>/…      -> sitio/<slug>/…
#
# /admin no llega aca: Traefik lo enruta al editor antes.

# La politica de cache depende de QUE se pide, no de donde esta. Con un `map`
# se declara una vez y vale para la raiz y para cada mapa, sin repetir bloques
# que despues divergen.
map $uri $mapa_cache {
    # Las paginas se regeneran en cada publicacion: que el navegador revalide
    # siempre. Con ETag el 304 sale gratis.
    default                "no-cache";
    # Los nombres de archivo llevan el id del archivo, asi que contenido nuevo
    # es siempre una ruta nueva. Se puede cachear con tranquilidad.
    ~*/contenidos/         "public, max-age=2592000";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    # La raiz del sitio son dos enlaces simbolicos al mapa predeterminado, asi
    # que seguirlos no es opcional. Es el valor por omision; se declara porque
    # el diseño entero depende de el.
    disable_symlinks off;

    # Sin listado de directorios: el arbol de multimedia no se navega.
    autoindex off;

    # Las paginas llevan el SVG, el JS y el catalogo inline: 220 KB que
    # comprimen muchisimo. El video ya esta comprimido, gzipearlo quema CPU.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Pedir a los buscadores que no indexen.
    #
    # Como cabecera y no como <meta> en la pagina: cubre tambien los videos y el
    # audio, que un meta no alcanza, y evita tocar mapa-base.html --que se
    # compara byte a byte contra lo que publico el pipeline anterior.
    #
    # Esto NO hace el sitio privado. Le pide a los buscadores que se porten
    # bien; cualquiera con la direccion sigue viendo todo. Para que de verdad no
    # sea publico hace falta contrasena.
    location = /robots.txt {
        add_header Content-Type text/plain;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        # `$uri/index.html` hace que /redmexico y /redmexico/ funcionen igual.
        try_files $uri $uri/index.html =404;
        add_header Cache-Control $mapa_cache;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }
}
