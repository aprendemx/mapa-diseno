# Sirve el mapa publicado. Solo lectura: nada de lo que hay aca lo escribe
# nginx -- el editor escribe, nginx entrega.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sin listado de directorios: contenidos/ no se navega.
    autoindex off;

    # La pagina lleva el SVG, el JS y el catalogo inline: 220 KB que comprimen
    # muchisimo. El video ya esta comprimido, gzipearlo solo quema CPU.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # La pagina se regenera en cada publicacion. Que el navegador revalide
    # siempre; con ETag el 304 sale gratis.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Los nombres de archivo llevan el id del archivo, asi que un contenido
    # nuevo es siempre una ruta nueva: se puede cachear con tranquilidad.
    location /contenidos/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
